# /etc/nginx/snippets/ixseal-tls.conf — 443·8443 server 블록에서 include
# (Ubuntu nginx.conf 의 http 블록 기본 ssl_* 설정과 겹치지 않도록 server 단위로 둔다)
ssl_certificate     /etc/ixseal/tls/cert.pem;
ssl_certificate_key /etc/ixseal/tls/key.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:ixseal_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
