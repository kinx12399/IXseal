# IXseal — install.sh 가 __SERVER_NAME__ / __APP_DIR__ 를 채워 /etc/nginx/sites-available/ixseal 로 설치한다.
#   443  : 고객용 (보안그룹 전체 허용)
#   8443 : 관리용 (보안그룹에서 사무실 IP만 허용)
# Ubuntu 24.04 의 nginx 1.24 기준 문법 (listen ... http2).

limit_req_zone $binary_remote_addr zone=ixseal_public:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ixseal_reveal:10m rate=10r/m;
limit_req_status 429;

upstream ixseal_public { server 127.0.0.1:8001; keepalive 8; }
upstream ixseal_admin  { server 127.0.0.1:8002; keepalive 8; }

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # 공인 인증서(ACME HTTP-01)를 쓸 때만 필요. 보안그룹에서 80을 열지 않으면 쓰이지 않는다.
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

# ───────── 고객용 443 ─────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __SERVER_NAME__;

    include /etc/nginx/snippets/ixseal-tls.conf;

    access_log /var/log/ixseal/nginx-public.log;
    error_log  /var/log/ixseal/nginx-public.error.log warn;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ {
        alias __APP_DIR__/ixseal/static/;
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # 열람(POST)은 더 촘촘하게 제한 (토큰 대입 방지)
    location ~ ^/s/[A-Za-z0-9_-]+/reveal$ {
        limit_req zone=ixseal_reveal burst=5 nodelay;
        proxy_pass http://ixseal_public;
        include /etc/nginx/snippets/ixseal-proxy.conf;
    }

    location /s/ {
        limit_req zone=ixseal_public burst=20 nodelay;
        proxy_pass http://ixseal_public;
        include /etc/nginx/snippets/ixseal-proxy.conf;
    }

    # 그 외 경로는 고객용 앱이 404 화면을 그린다 (관리 기능은 이 앱에 없다)
    location / {
        limit_req zone=ixseal_public burst=20 nodelay;
        proxy_pass http://ixseal_public;
        include /etc/nginx/snippets/ixseal-proxy.conf;
    }
}

# ───────── 관리용 8443 (보안그룹: 사무실 IP만) ─────────
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name __SERVER_NAME__;

    include /etc/nginx/snippets/ixseal-tls.conf;

    access_log /var/log/ixseal/nginx-admin.log;
    error_log  /var/log/ixseal/nginx-admin.error.log warn;
    client_max_body_size 60m;   # 파일 첨부: 파일당 20MB, 전체 50MB + 여유

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ {
        alias __APP_DIR__/ixseal/static/;
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        proxy_pass http://ixseal_admin;
        include /etc/nginx/snippets/ixseal-proxy.conf;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }
}
